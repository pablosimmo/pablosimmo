    <div class="cc-contact-information" style="background-image: url('images/staticmap.png')">
     <div class="container">
      <div class="cc-contact">
       <div class="row">
        <div class="col-md-9">
         <div class="card mb-0" data-aos="zoom-in">
          <div class="h4 text-center title">
           Contact Me
          </div>
          <div class="row">
           <div class="col-md-6">
            <div class="card-body">
             <form action="https://formspree.io/f/xvgqblke" id="contact-form" method="POST">
              <div class="p pb-3">
               <strong>
                Feel free to contact me
               </strong>
              </div>
              <div class="row mb-3">
               <div class="col">
                <div class="input-group">
                 <span class="input-group-addon">
                  <i class="fa fa-user-circle">
                  </i>
                 </span>
                 <input class="form-control" name="name" placeholder="Name" required="" type="text"/>
                </div>
               </div>
              </div>
              <div class="row mb-3">
               <div class="col">
                <div class="input-group">
                 <span class="input-group-addon">
                  <i class="fa fa-file-text">
                  </i>
                 </span>
                 <input class="form-control" name="subject" placeholder="Subject" required="" type="text"/>
                </div>
               </div>
              </div>
              <div class="row mb-3">
               <div class="col">
                <div class="input-group">
                 <span class="input-group-addon">
                  <i class="fa fa-envelope">
                  </i>
                 </span>
                 <input class="form-control" name="email" placeholder="E-mail" required="" type="email"/>
                </div>
               </div>
              </div>
              <div class="row mb-3">
               <div class="col">
                <div class="form-group">
                 <textarea class="form-control" name="message" placeholder="Your Message" required=""></textarea>
                </div>
               </div>
              </div>
              <div class="row">
               <div class="col">
                <button class="btn btn-primary" type="submit">
                 Send
                </button>
               </div>
              </div>
              <p id="form-message" style="margin-top:10px;">
              </p>
             </form>
             <script>
              const form = document.getElementById("contact-form");
                          const message = document.getElementById("form-message");

                          form.addEventListener("submit", async (e) => {
                            e.preventDefault();
                            const res = await fetch(form.action, {
                              method: "POST",
                              body: new FormData(form),
                              headers: { 'Accept': 'application/json' }
                            });

                            if (res.ok) {
                              message.innerText = "Thank you! Your message has been sent.";
                              form.reset();
                            } else {
                              message.innerText = "Oops! Something went wrong. Please try again.";
                            }
                          });
             </script>
            </div>
           </div>
